<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Karty</title>
  <meta name="description" content="Namier kameru na hracie karty a poradí ti, čo hrať: blackjack, poker, žolík.">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Karty">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="frame" hidden></canvas>
  <canvas id="overlay"></canvas>

  <header id="top" class="top">
    <nav id="games" class="games" aria-label="Hra">
      <button type="button" data-game="blackjack">Blackjack</button>
      <button type="button" data-game="poker">Poker</button>
      <button type="button" data-game="zolik">Žolík</button>
    </nav>
    <button id="settingsBtn" class="round" type="button" aria-label="Nastavenia">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.6"/><circle cx="8" cy="17" r="2.6"/></svg>
    </button>
  </header>

  <section id="advice" class="advice" aria-live="polite">
    <p id="action" class="action"></p>
    <ul id="lines" class="lines"></ul>
    <div id="extras" class="extras"></div>
  </section>

  <footer id="bottom" class="bottom">
    <button id="roundBtn" class="pill" type="button">Nové kolo</button>
    <button id="shutter" class="shutter" type="button" aria-label="Zastaviť obraz">
      <svg class="icon-pause" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="5.5" y="4" width="4.5" height="16" rx="1.6" fill="currentColor"/><rect x="14" y="4" width="4.5" height="16" rx="1.6" fill="currentColor"/></svg>
      <svg class="icon-play" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M8 4.8v14.4a1 1 0 0 0 1.5.9l12-7.2a1 1 0 0 0 0-1.8l-12-7.2A1 1 0 0 0 8 4.8z" fill="currentColor"/></svg>
    </button>
    <button id="addBtn" class="pill" type="button">+ Karta</button>
  </footer>
  <input id="photoInput" type="file" accept="image/*" hidden>

  <section id="boot" class="boot">
    <h1 class="boot-name">Karty</h1>
    <p id="bootStatus" class="boot-status">Pripravujem sa</p>
    <p id="bootNote" class="boot-note">Prvé spustenie stiahne asi 20 MB (model na rozpoznávanie kariet). Potom to funguje aj bez internetu.</p>
    <div id="bootActions" class="boot-actions" hidden>
      <button id="retryBtn" class="btn on-dark" type="button">Skúsiť znova</button>
      <button id="bootPhotoBtn" class="btn on-dark outline" type="button">Použiť fotku</button>
    </div>
  </section>

  <div id="scrim" class="scrim"></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" inert></section>
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
